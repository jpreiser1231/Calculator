<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Jayson P's Calculator</title>
    <script src = "functions.js"></script>
    <link rel = "stylesheet" href = "style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
</head>
<body>
<div class="grid-container">
    <div  id = "display" class="item1"> </div>
    <div class="grid-item " onclick = "clickClear()">Clear</div>
    <div class="grid-item" onclick = "" >Extra</div>
    <div class="grid-item" onclick = "">( )</div>
    <div class="grid-item" onclick = "clickMult()">*</div>
    <div class="grid-item" onclick = "clickSlash()">/</div>
    <div class="grid-item" onclick = "">Sqrt</div>
    <div class="grid-item" onclick = "click7()">7</div>
    <div class="grid-item" onclick = "click8()">8</div>
    <div class="grid-item" onclick = "click9()">9</div>
    <div class="grid-item" onclick = "clickMinus()">-</div>
    <div class="grid-item" onclick = "">^</div>
    <div class="grid-item" onclick = "click4()">4</div>
    <div class="grid-item" onclick = "click5()">5</div>
    <div class="grid-item" onclick = "click6()">6</div>
    <div class="grid-item" onclick = "clickPlus()">+</div>
    <div class="grid-item" onclick = "clickBackspace()">Backspace</div>
    <div class="grid-item" onclick = "click1()" >1</div>
    <div class="grid-item" onclick = "click2()">2</div>
    <div class="grid-item" onclick = "click3()">3</div>
    <div class="grid-item" onclick = "clickEnter()">Enter</div>
</div>
</body>
</html>

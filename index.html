<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Jayson P's Calculator</title>
    <script src = "functions.js"></script>
    <link rel = "stylesheet" href = "style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
</head>
<body id = "body">
<div class = "container d-block ">
    <h1 id = "title" > Jayson P's Calculator </h1>
<div class="grid-container container-fluid" id = "calc">
    <div  id = "display" class="item1"> </div>
    <div class="grid-item c1" onclick = "clickClear()">C</div>
    <div class="grid-item c2" onclick = "clickBackspace()" > ⌫ </div>
    <div class="grid-item cp1" onclick = "clickOpen()">(</div>
    <div class="grid-item cp2" onclick = "clickClose()">)</div>
    <div class="grid-item c4" onclick = "clickMult()">×</div>
    <div class="grid-item c5" onclick = "clickSlash()">/</div>
    <div class="grid-item c1" onclick = "clickSqrt()"> √ </div>
    <div class="grid-item c2" onclick = "click7()">7</div>
    <div class="grid-item c3" onclick = "click8()">8</div>
    <div class="grid-item c4" onclick = "click9()">9</div>
    <div class="grid-item c5" onclick = "clickMinus()">-</div>
    <div class="grid-item c1" onclick = "clickExponent()">^</div>
    <div class="grid-item c2" onclick = "click4()">4</div>
    <div class="grid-item c3" onclick = "click5()">5</div>
    <div class="grid-item c4" onclick = "click6()">6</div>
    <div class="grid-item c5" onclick = "clickPlus()">+</div>
    <div class="grid-item c1" onclick = "click0()">0</div>
    <div class="grid-item c2" onclick = "click1()" >1</div>
    <div class="grid-item c3" onclick = "click2()">2</div>
    <div class="grid-item c4" onclick = "click3()">3</div>
    <div class="grid-item c5" onclick = "clickEnter()">Enter</div>
</div>
    <div class="dropdown" onclick = "clickHistory()">
        <button class="btn btn-primary dropdown-toggle" type="button" data-bs-toggle="dropdown">History
            <span class="caret"></span></button>
        <ul class="dropdown-menu" id = "dropdown">

        </ul>
    </div>
</div>

</body>
</html>
